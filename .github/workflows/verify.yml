name: Verify app
on:
  push:
    branches: [main]
    paths: ['.verify-trigger']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit and Compose UI tests
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon --console=plain --continue
      - name: Android lint
        if: always()
        run: bash ./gradlew :app:lintRelease --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/screenshots/
