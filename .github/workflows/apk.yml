name: Build APK
on:
  push:
    branches: [main]
    paths-ignore: ['app/src/test/**', '.verify-trigger', '.github/workflows/verify.yml', '**.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build unsigned release APK
        run: bash ./gradlew :app:assembleRelease --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: feldsher-notes-1.3.1-unsigned
          path: app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
