name: Prepare local signing tool
on:
  push:
    paths: ['.github/workflows/signing-tool.yml']
permissions:
  contents: read
jobs:
  tool:
    runs-on: ubuntu-latest
    steps:
      - name: Stage SDK signing utility
        run: |
          mkdir -p signing-tool
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signing-tool/
      - uses: actions/upload-artifact@v4
        with:
          name: android-signing-tool
          path: signing-tool/apksigner.jar
